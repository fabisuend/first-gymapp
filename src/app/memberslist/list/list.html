<div class="listcontainer">
  <div class="listcontaineralignbox">
    <div class="headlinecontainer"> 
      <h1> Mitgliederliste</h1>
    </div>
    <ul>
      @for (user of users; track user.id) {
        <li>{{ user.name }} – {{ user.email }} – {{ user.username }}</li>
      }
    </ul>
  </div>
</div>
